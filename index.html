<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #fafafa;
            font-family: 'Poppins', sans-serif;
            color: #333;
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            transition: opacity 1.5s ease-in-out;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        .intro-text {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #444;
            max-width: 400px;
            animation: fadeIn 2s ease-in-out;
        }

        .btn-violet {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-violet:active {
            transform: scale(0.95);
        }

        /* Container & SVG Setup Terkoreksi */
        .flower-container {
            width: 320px;
            height: 320px;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .flower-svg {
            width: 100%;
            height: 100%;
            stroke: #8b5cf6;
            stroke-width: 2; /* Garis ditebalkan agar jelas di HP */
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Setup Animasi CSS SVG */
        .stem-path {
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
        }

        .bloom-path {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            fill: transparent;
        }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        @keyframes fillBloom {
            to { fill: rgba(139, 92, 246, 0.12); }
        }

        /* Pesan Akhir */
        .message-group {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease-out;
        }

        .message-group.show {
            opacity: 1;
            transform: translateY(0);
        }

        .title-aesthetic {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #8b5cf6;
            font-style: italic;
            margin-bottom: 20px;
        }

        .spirit-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 15px;
            color: #222;
        }

        .no-pressure {
            font-size: 0.85rem;
            color: #888;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            line-height: 1.6;
            max-width: 500px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="Clairo_Juna.mp3" preload="auto"></audio>

    <div id="screen-intro" class="screen active">
        <div class="intro-text">
            <p>Halo neng,</p>
            <p>how've you been lately? I hope everything's doing just fine with you.</p>
            <br>
            <p>Honestly I have something to show you on the button below.</p>
        </div>
        <button id="start-btn" class="btn-violet">Click Here</button>
    </div>

    <div id="screen-main" class="screen">
        
        <div id="flower" class="flower-container">
            <svg class="flower-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                
                <path class="stem-path" d="M96 170 L96 195 M104 170 L104 195" />
                
                <path class="stem-path" d="M100 170 Q100 130 100 90" />
                
                <path class="stem-path" d="M100 170 Q70 150 45 90" />
                
                <path class="stem-path" d="M100 170 Q130 150 155 90" />


                <g transform="translate(100, 90)">
                    <path class="bloom-path" d="M0 0 Q-5 -30 -30 -50 Q-10 -60 0 -40 Q10 -60 30 -50 Q5 -30 0 0" />
                    <path class="bloom-path" d="M0 -40 Q-20 -80 0 -80 Q20 -80 0 -40" />
                    <path class="bloom-path" d="M0 -40 Q-30 -70 -40 -50 Q-20 -40 0 -40" />
                    <path class="bloom-path" d="M0 -40 Q30 -70 40 -50 Q20 -40 0 -40" />
                </g>

                <g transform="translate(45, 90) rotate(-35)">
                    <path class="bloom-path" d="M0 0 Q-5 -30 -30 -50 Q-10 -60 0 -40 Q10 -60 30 -50 Q5 -30 0 0" />
                    <path class="bloom-path" d="M0 -40 Q-20 -80 0 -80 Q20 -80 0 -40" />
                    <path class="bloom-path" d="M0 -40 Q-30 -70 -40 -50 Q-20 -40 0 -40" />
                    <path class="bloom-path" d="M0 -40 Q30 -70 40 -50 Q20 -40 0 -40" />
                </g>

                <g transform="translate(155, 90) rotate(35)">
                    <path class="bloom-path" d="M0 0 Q-5 -30 -30 -50 Q-10 -60 0 -40 Q10 -60 30 -50 Q5 -30 0 0" />
                    <path class="bloom-path" d="M0 -40 Q-20 -80 0 -80 Q20 -80 0 -40" />
                    <path class="bloom-path" d="M0 -40 Q-30 -70 -40 -50 Q-20 -40 0 -40" />
                    <path class="bloom-path" d="M0 -40 Q30 -70 40 -50 Q20 -40 0 -40" />
                </g>

            </svg>
        </div>

        <div id="msg-1" class="message-group">
            <div class="title-aesthetic">To someone who loves Clairo songs 🎧🌸</div>
        </div>

        <div id="msg-2" class="message-group" style="margin-top: 15px;">
            <div class="spirit-text">Semangat Yaa buat UAS hari ini! ✨</div>
        </div>

        <div id="msg-3" class="message-group">
            <div class="no-pressure">
                Good luck on your exam tomorrow!
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("start-btn");
            const screenIntro = document.getElementById("screen-intro");
            const screenMain = document.getElementById("screen-main");
            const music = document.getElementById("bg-music");
            const flowerContainer = document.getElementById("flower");
            
            // Selector Animasi SVG
            const stems = document.querySelectorAll('.stem-path');
            const blooms = document.querySelectorAll('.bloom-path');

            // Selector Teks
            const msg1 = document.getElementById("msg-1");
            const msg2 = document.getElementById("msg-2");
            const msg3 = document.getElementById("msg-3");

            btn.addEventListener("click", () => {
                // Audio Main
                music.play().catch(e => console.log("Audio diblokir browser"));

                // Transisi Layar
                screenIntro.classList.remove("active");

                setTimeout(() => {
                    screenMain.classList.add("active");
                    flowerContainer.style.opacity = "1";
                    
                    // 1. Gambar Batang Serentak
                    stems.forEach(stem => {
                        stem.style.animation = "drawLine 1.5s forwards ease-out";
                    });

                    // 2. Gambar dan Mekarkan Bunga (Delay 1 detik agar batang sampai atas dulu)
                    setTimeout(() => {
                        blooms.forEach(bloom => {
                            bloom.style.animation = "drawLine 2.5s forwards ease-out, fillBloom 3s forwards 1s ease-in-out";
                        });
                    }, 1000);

                    // 3. Teks Keluar Berurutan
                    setTimeout(() => { msg1.classList.add("show"); }, 4000);
                    setTimeout(() => { msg2.classList.add("show"); }, 5500);
                    setTimeout(() => { msg3.classList.add("show"); }, 7000);

                }, 1000);
            });
        });
    </script>
</body>
</html>
