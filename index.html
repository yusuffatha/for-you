<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #fafafa;
            font-family: 'Poppins', sans-serif;
            color: #333;
            overflow: hidden; /* Mencegah scrolling saat transisi */
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container untuk Layar */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            transition: opacity 1.5s ease-in-out;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        /* Teks Intro */
        .intro-text {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #444;
            max-width: 400px;
            animation: fadeIn 2s ease-in-out;
        }

        /* Tombol Violet */
        .btn-violet {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-violet:active {
            transform: scale(0.95);
        }

        /* Animasi Bunga Lily (SVG Drawing Effect) */
        .flower-container {
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .flower-svg {
            width: 100%;
            height: 100%;
            stroke: #8b5cf6;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
        }

        .draw-animation {
            animation: draw 10s forwards ease-in-out;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
                fill: rgba(139, 92, 246, 0.1);
            }
        }

        /* Pesan Akhir */
        .message-group {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease-out;
        }

        .message-group.show {
            opacity: 1;
            transform: translateY(0);
        }

        .title-aesthetic {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #8b5cf6;
            font-style: italic;
            margin-bottom: 20px;
        }

        .spirit-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 15px;
            color: #222;
        }

        /* Pesan Tanpa Tekanan (No Pressure) */
        .no-pressure {
            font-size: 0.85rem;
            color: #888;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            line-height: 1.6;
        }

        /* Keyframes Umum */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="Clairo_Juna.mp3" preload="auto"></audio>

    <div id="screen-intro" class="screen active">
        <div class="intro-text">
            <p>Halo neng,</p>
            <p>how've you been lately? I hope everything's doing just fine with you.</p>
            <br>
            <p>Honestly I have something to show you on the button below.</p>
        </div>
        <button id="start-btn" class="btn-violet">Click Here</button>
    </div>

    <div id="screen-main" class="screen">
        
        <div id="flower" class="flower-container">
            <svg class="flower-svg" id="lily-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 90 Q45 60 20 40 Q40 30 50 50 Q60 30 80 40 Q55 60 50 90" stroke-linecap="round"/>
                <path d="M50 50 Q30 10 50 10 Q70 10 50 50" stroke-linecap="round"/>
                <path d="M50 50 Q20 20 10 40 Q30 50 50 50" stroke-linecap="round"/>
                <path d="M50 50 Q80 20 90 40 Q70 50 50 50" stroke-linecap="round"/>
                <path d="M48 90 L48 100 M52 90 L52 100" stroke-width="1"/>
            </svg>
        </div>

        <div id="msg-1" class="message-group">
            <div class="title-aesthetic">To someone who loves Clairo songs 🎧🌸</div>
        </div>

        <div id="msg-2" class="message-group" style="margin-top: 15px;">
            <div class="spirit-text">Semangat Yaa buat UAS hari nii! 🐈😸🌟🌠🌈☃️🫧✨🌸🪷🌹🌷🌼🌻🌺🪻</div>
        </div>

        <div id="msg-3" class="message-group">
            <div class="no-pressure">
                Good luck on your exam neng
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("start-btn");
            const screenIntro = document.getElementById("screen-intro");
            const screenMain = document.getElementById("screen-main");
            const music = document.getElementById("bg-music");
            const flower = document.getElementById("flower");
            const svgPath = document.getElementById("lily-svg");
            
            const msg1 = document.getElementById("msg-1");
            const msg2 = document.getElementById("msg-2");
            const msg3 = document.getElementById("msg-3");

            btn.addEventListener("click", () => {
                // 1. Mulai putar lagu Clairo
                music.play().catch(error => {
                    console.log("Audio autoplay diblokir, tapi proses jalan terus.");
                });

                // 2. Transisi Hilangkan Layar 1
                screenIntro.classList.remove("active");

                // 3. Tampilkan Layar 2 setelah delay 1 detik (agar transisi halus)
                setTimeout(() => {
                    screenMain.classList.add("active");
                    flower.style.opacity = "1";
                    
                    // Mulai animasi gambar garis SVG
                    svgPath.classList.add("draw-animation");

                    // 4. Munculkan Teks 1 (To someone...) setelah gambar bunga mulai terbentuk
                    setTimeout(() => {
                        msg1.classList.add("show");
                    }, 2000);

                    // 5. Munculkan Teks 2 (Semangat UAS)
                    setTimeout(() => {
                        msg2.classList.add("show");
                    }, 3500);

                    // 6. Munculkan Teks Terakhir (No Pressure)
                    setTimeout(() => {
                        msg3.classList.add("show");
                    }, 5000);

                }, 1000);
            });
        });
    </script>
</body>
</html>
